<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover libera a área do entalhe; as margens seguras são
         repostas no CSS com env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F5F0" />
    <meta name="description" content="Protótipo do app da plataforma de equilíbrio: treinos guiados em 3D com correção pela distribuição de peso." />
    <!-- O GitHub Pages não deixa definir cabeçalhos HTTP, então a CSP vai aqui.
         style-src precisa de 'unsafe-inline' porque Motion e o React Three Fiber
         escrevem estilo inline nos elementos; script-src continua só 'self'.
         blob: em worker-src e img-src é para o 3D (texturas e workers). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Protótipo do app</title>
  </head>
  <body>
    <div id="raiz"></div>
    <noscript>Este protótipo precisa de JavaScript ativado.</noscript>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
